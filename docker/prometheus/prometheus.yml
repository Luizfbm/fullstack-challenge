global:
  scrape_interval: 5s

scrape_configs:
  - job_name: games
    metrics_path: /metrics
    static_configs:
      - targets: ["games:4001"]
  - job_name: wallets
    metrics_path: /metrics
    static_configs:
      - targets: ["wallets:4002"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
