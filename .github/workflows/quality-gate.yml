name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Baseline ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Block critical vulnerabilities
        run: bun audit --audit-level=critical

      - name: Warn on high vulnerabilities
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      - name: Unit tests
        run: bun run test:unit

      - name: Coverage
        run: bun run test:coverage

      - name: Quality gate
        run: bun run quality:gate

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: |
            coverage
            quality/reports
          if-no-files-found: ignore

      - name: Comment quality gate summary
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- crash-game-quality-gate -->";
            const summaryPath = "quality/reports/quality-gate-summary.md";
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, "utf8")
              : "Quality gate stopped before the summary report was generated. Check the workflow logs and artifacts.";
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

  docker-e2e:
    name: Docker Kong Keycloak E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Compose
        run: docker compose config

      - name: Run API E2E through Kong and Keycloak
        run: bun run ci:e2e

      - name: Capture Docker logs
        if: always()
        run: |
          mkdir -p quality/reports
          docker compose logs --no-color > quality/reports/docker-compose.log

      - name: Upload Docker artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e
          path: quality/reports/docker-compose.log
          if-no-files-found: ignore

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans
